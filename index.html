<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><title>John – Concierge</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,sans-serif;background:radial-gradient(circle at 50% 30%,#2b4a7a,#0d1a2e);color:#fff;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%;align-items:center}
h1{margin:14px 0 0;font-weight:300;letter-spacing:2px;font-size:22px;opacity:.8}
#face{position:relative;width:min(55vw,46vh);aspect-ratio:1;margin-top:2vh;border-radius:50%;background:radial-gradient(circle at 40% 35%,#f3d2b0,#d9a47a);box-shadow:0 0 60px #f6b85a88;transition:transform .3s}
#face.listening{box-shadow:0 0 90px #6cf}
#face.thinking{animation:bob 1s infinite ease-in-out}
@keyframes bob{50%{transform:translateY(-10px) rotate(-3deg)}}
.eye{position:absolute;top:34%;width:14%;height:18%;background:#2a2a3a;border-radius:50%;animation:blink 4s infinite}
.eye.l{left:27%}.eye.r{right:27%}
.eye::after{content:'';position:absolute;top:18%;left:22%;width:30%;height:30%;background:#fff;border-radius:50%}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.cheek{position:absolute;top:56%;width:14%;height:8%;background:#ff8a8a66;border-radius:50%}.cheek.l{left:14%}.cheek.r{right:14%}
#mouth{position:absolute;left:50%;top:62%;width:34%;height:12%;transform:translateX(-50%);border:6px solid #2a2a3a;border-top:none;border-radius:0 0 100px 100px;transition:height .08s}
#face.speaking #mouth{background:#7a2a3a;border-radius:0 0 100px 100px}
#log{flex:1;width:min(92vw,800px);overflow-y:auto;padding:10px;margin-top:2vh;font-size:20px}
.m{padding:10px 14px;border-radius:16px;margin:6px 0;max-width:85%;line-height:1.35}
.user{background:#ffffff22;margin-left:auto}.bot{background:#f6b85a33}
#bar{display:flex;gap:10px;width:min(92vw,800px);padding:12px 0 20px}
#q{flex:1;font-size:20px;padding:14px 18px;border-radius:30px;border:none;outline:none}
button{font-size:24px;border:none;border-radius:50%;width:64px;height:64px;background:#f6b85a;color:#222;cursor:pointer}
#mic.on{background:#6cf;animation:bob .8s infinite}
#chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:min(92vw,800px)}
.chip{font-size:15px;padding:8px 12px;border-radius:20px;background:#ffffff1a;cursor:pointer}
.hair{position:absolute;top:-4%;left:8%;width:84%;height:34%;background:#5a3b22;border-radius:50% 50% 30% 30%/80% 80% 20% 20%}
.beard{position:absolute;bottom:-2%;left:16%;width:68%;height:42%;background:#6b4a2e;border-radius:10% 10% 50% 50%/10% 10% 90% 90%;z-index:0}
.brow{position:absolute;top:27%;width:18%;height:4%;background:#3a2615;border-radius:4px}.brow.l{left:24%}.brow.r{right:24%}
#mouth{z-index:1}
#face{background:#fff;overflow:visible;border:3px solid #c9a96e;box-shadow:0 0 0 8px #ffffff10,0 0 40px #c9a96e55}
#face img{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:50% 10%;display:block}
#face .hair,#face .beard,#face .brow,#face .eye{display:none}
#mouth{display:none}
#face::after{content:'';position:absolute;inset:-6px;border-radius:50%;border:2px solid #c9a96e;opacity:0;pointer-events:none}
#face.speaking::after{animation:pulse 1.1s ease-out infinite}
#face.speaking{box-shadow:0 0 0 8px #c9a96e22,0 0 70px #c9a96e99}
#face.listening{box-shadow:0 0 0 8px #6cf3,0 0 80px #6cf}
@keyframes pulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.18);opacity:0}}
</style></head><body><div id="app">
<h1>JOHN · Vaasa Concierge</h1>
<div id="face"><img src="john.jpg" alt="John"><div id="mouth"></div></div>
<div id="log"></div>
<div id="chips"></div>
<div id="bar"><button id="lang" style="font-size:18px;font-weight:700">DE</button><button id="mic" title="Gedrückt halten zum Sprechen">🎤</button><input id="q" placeholder="Frag mich etwas …"><button id="send">➤</button></div>
</div>
<script>
const face=document.getElementById('face'),mouth=document.getElementById('mouth'),log=document.getElementById('log'),q=document.getElementById('q'),mic=document.getElementById('mic');
let msgs=[],voice=null,unlocked=false;
let voiceMale=false,lang='de';const MALE=/(?<!fe)male|männlich|conrad|stefan|markus|hans|klaus|yannick|killian|florian|daniel|david|guy|ryan|thomas|george|james|alex|fred|arthur|aaron|google uk english male/i;
function pickVoice(){const L=new RegExp('^'+lang,'i');const vs=speechSynthesis.getVoices().filter(x=>L.test(x.lang));const m=vs.find(x=>MALE.test(x.name));voiceMale=!!m;voice=m||vs[0]||null;}
function _oldPick(){const v=speechSynthesis.getVoices();const m=v.find(x=>/^de/i.test(x.lang)&&/(?<!fe)male|männlich|conrad|stefan|markus|hans|klaus|yannick|killian|florian/i.test(x.name));voiceMale=!!m;voice=m||v.find(x=>/^de/i.test(x.lang)&&/male|männlich|conrad|stefan|markus|hans|klaus|yannick|killian|florian|google deutsch/i.test(x.name))||v.find(x=>/^de/i.test(x.lang))||null}
speechSynthesis.onvoiceschanged=pickVoice;pickVoice();
function add(role,t){const d=document.createElement('div');d.className='m '+(role==='user'?'user':'bot');d.textContent=t;log.appendChild(d);log.scrollTop=1e9}
let mt=null;
function speak(t){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=lang==='en'?'en-GB':'de-DE';if(voice)u.voice=voice;u.rate=1.02;u.pitch=voiceMale?0.95:0.75;
 u.onstart=()=>{face.classList.add('speaking');mt=setInterval(()=>mouth.style.height=(4+Math.random()*16)+'%',110)};
 u.onend=u.onerror=()=>{face.classList.remove('speaking');clearInterval(mt);mouth.style.height='12%'};
 u.onboundary=()=>mouth.style.height=(8+Math.random()*14)+'%';speechSynthesis.speak(u)}
async function ask(t){t=t.trim();if(!t)return;add('user',t);msgs.push({role:'user',content:t});q.value='';face.classList.add('thinking');
 try{const r=await fetch('https://kerjrjydqnouuxerzgmt.supabase.co/functions/v1/guest-concierge/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:msgs})});const j=await r.json();
  if(j.lang&&j.lang!==lang)setLang(j.lang);msgs.push({role:'assistant',content:j.reply});add('bot',j.reply);face.classList.remove('thinking');speak(j.reply)}
 catch(e){face.classList.remove('thinking');add('bot','Hoppla, keine Verbindung.')}}
document.getElementById('send').onclick=()=>ask(q.value);q.onkeydown=e=>{if(e.key==='Enter')ask(q.value)};
['Wie ist das WLAN-Passwort?','Wie wird das Wetter?','Wie funktioniert die Sauna?','Wann hat Alko offen?','Was kann man in Vaasa machen?'].forEach(c=>{const s=document.createElement('span');s.className='chip';s.textContent=c;s.onclick=()=>ask(c);chips.appendChild(s)});
function setLang(l){lang=l;document.getElementById('lang').textContent=l.toUpperCase();if(rec)rec.lang=l==='en'?'en-GB':'de-DE';q.placeholder=l==='en'?'Ask me anything …':'Frag mich etwas …';pickVoice();}
document.getElementById('lang').onclick=()=>setLang(lang==='de'?'en':'de');
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null,heard='';
if(SR){rec=new SR();rec.lang='de-DE';rec.interimResults=true;rec.continuous=true;
 rec.onresult=e=>{heard=[...e.results].map(r=>r[0].transcript).join(' ');q.value=heard};
 rec.onend=()=>{mic.classList.remove('on');face.classList.remove('listening');if(heard)ask(heard);heard=''}}
else mic.style.opacity=.3;
function start(e){e.preventDefault();speechSynthesis.cancel();if(!rec)return alert('Spracherkennung wird von diesem Browser nicht unterstützt (Chrome empfohlen).');heard='';try{rec.start()}catch{}mic.classList.add('on');face.classList.add('listening')}
function stop(e){e.preventDefault();if(rec)try{rec.stop()}catch{}}
mic.addEventListener('pointerdown',start);mic.addEventListener('pointerup',stop);mic.addEventListener('pointerleave',e=>{if(mic.classList.contains('on'))stop(e)});
const hi='Hallo Jürgen, hallo Papa! Ich bin John, euer Concierge in der All-Inclusive Vaasa Edition. Fragt mich alles – vom WLAN bis zur Sauna. I speak English too!';
add('bot',hi);msgs.push({role:'assistant',content:hi});
document.body.addEventListener('pointerdown',()=>{if(!unlocked){unlocked=true;speak('Hallo! Schön, dass ihr da seid.')}},{once:true});
</script></body></html>
